[build]
  command = "npm run build"
  publish = "dist"

[[redirects]]
  from = "/manifest.json"
  to = "/manifest.json"
  status = 200

# Same-origin passthrough to Supabase. Some networks block *.supabase.co
# outright (DNS/SNI-level filtering) rather than just being slow — no client
# retry to that hostname can ever work around that. Routing through our own
# domain instead means Netlify's edge makes the real request server-side,
# which isn't subject to that client-side block. Must stay above the SPA
# catch-all below, since redirects match top-down and /* would otherwise
# swallow this first. See src/db/supabase.ts for the client-side fallback
# that switches to this path when the direct connection fails.
[[redirects]]
  from = "/supabase-proxy/*"
  to = "https://oabubrdgmhohlaamsrel.supabase.co/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/*.js"
  [headers.values]
    Content-Type = "application/javascript; charset=utf-8"
    X-Content-Type-Options = "nosniff"

# Netlify doesn't know the .geojson extension by default and would fall
# back to application/octet-stream, which also skips its automatic
# gzip/brotli compression — explicit JSON content-type gets both a correct
# MIME type and (since it's now recognized as text) real compression on a
# ~48MB file. max-age is short-ish (30 min), not "immutable" — this file
# gets overwritten on each fresh parcel export, not cache-busted by a
# hashed filename, so it needs to actually revalidate periodically.
[[headers]]
  for = "/data/*.geojson"
  [headers.values]
    Content-Type = "application/geo+json; charset=utf-8"
    Cache-Control = "public, max-age=1800, must-revalidate"